spring.application.name=currency-exchange-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/currency_exchange}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
exchange.api.base-url=https://api.frankfurter.dev/v2
exchange.cache-duration=${RATE_CACHE_DURATION:PT1H}
server.error.include-message=never
server.error.include-stacktrace=never
